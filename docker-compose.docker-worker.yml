services:
  worker:
    environment:
      WORKER_MODE: docker
      DOCKER_SOCKET: /var/run/docker.sock
      AGENT_NETWORK: hiveswarm-agent-egress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [control, agent-egress]

networks:
  agent-egress:
    name: hiveswarm-agent-egress
