services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hiveswarm
      POSTGRES_USER: hiveswarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hiveswarm}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiveswarm -d hiveswarm"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [control]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis-data:/data
    networks: [control]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 4100
      WEB_ORIGIN: http://localhost:3000
      STORAGE_DRIVER: postgres
      DATABASE_URL: postgresql://hiveswarm:${POSTGRES_PASSWORD:-hiveswarm}@postgres:5432/hiveswarm
      REDIS_URL: redis://redis:6379
      AGENT_REGISTRY_PATH: /workspace/agents
      EXECUTION_DRIVER: queue
      AGENT_CALLBACK_TOKEN: ${AGENT_CALLBACK_TOKEN:-development-only-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "4100:4100"
    networks: [control]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      API_URL: http://api:4100
      AGENT_REGISTRY_PATH: /workspace/agents
      AGENT_CALLBACK_TOKEN: ${AGENT_CALLBACK_TOKEN:-development-only-change-me}
      WORKER_MODE: simulated
      WORKER_CONCURRENCY: 3
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_started }
    networks: [control]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4100
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks: [control]

volumes:
  postgres-data:
  redis-data:

networks:
  control:
    name: hiveswarm-control
